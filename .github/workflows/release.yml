name: Build and Release telupsc

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build cross-platform binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Build binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          VERSION="${GITHUB_REF_NAME:-${GITHUB_HEAD_REF:-dev}}"
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          fi

          BUILD_TARGET=""
          for candidate in ./cmd/telupsc ./cmd/telucode .; do
            if go list -f '{{.Name}}' "$candidate" >/dev/null 2>&1; then
              PKG_NAME="$(go list -f '{{.Name}}' "$candidate")"
              if [[ "$PKG_NAME" == "main" ]]; then
                BUILD_TARGET="$candidate"
                break
              fi
            fi
          done

          if [[ -z "$BUILD_TARGET" ]]; then
            echo "No main package found. Checked: ./cmd/telupsc ./cmd/telucode ."
            exit 1
          fi

          echo "Using build target: $BUILD_TARGET"

          TARGETS=(
            "windows amd64"
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
          )

          for target in "${TARGETS[@]}"; do
            GOOS="${target% *}"
            GOARCH="${target#* }"

            EXT=""
            if [[ "$GOOS" == "windows" ]]; then
              EXT=".exe"
            fi

            OUT="dist/telupsc_${VERSION}_${GOOS}_${GOARCH}${EXT}"
            echo "Building $OUT"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags "-s -w -X main.Version=${VERSION}" -o "$OUT" "$BUILD_TARGET"
          done

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: telupsc-binaries
          path: dist/*
          if-no-files-found: error

  release:
    name: Upload binaries to GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: telupsc-binaries
          path: dist

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
